module: process
owns: [include/kernel/proc.h, kernel/proc/proc.c, arch/riscv64/switch.S]
state: Single PCB, boot context, owner CPU, per-owner current pointer
rules:
  - PCB fields include pid, pgtbl, heap_top, mmap, ustack_pages, tf, kstack, ctx
  - Run on boot hart only; no locks held across swtch; IRQ disabled at switches
  - Never free a live kernel stack or active user page table
  - Creation failure frees all allocations and table nodes
functions:
  proc_make_first:
    pre: Boot hart with IRQ off; allocator and kernel VM initialized; no existing process
    effects: Allocate private resources; map user image/data/stack/tf/trampoline and kernel stack alias
    post: Return 0 with READY process, or -1 with all resources reclaimed
  proc_run:
    pre: READY process owned by current hart; normal boot stack; no locks
    effects: Disable IRQ, publish current, swtch from boot context into process context
    post: On exit/fault resume boot context, clear current, report status; IRQ remains off
  proc_current:
    pre: Valid kernel tp and CPU ID
    effects: Read current hart process pointer
    post: Return current PCB or NULL
  proc_finish:
    pre: Owner process running in kernel with IRQ off and kernel stvec/satp
    effects: Save exit or fault status; swtch to boot context
    post: Does not return to terminated user execution
  proc_destroy:
    pre: Process inactive, running on boot stack with IRQ off
    effects: Destroy heap pages/nodes; unmap kernel stack leaf; free private frames and table nodes
    post: PCB empty; page counts restored except persistent shared kernel mapping topology
  swtch:
    pre: IRQ off, old/new valid nonoverlapping contexts, new sp aligned, no locks
    effects: Save ra/sp/s0-s11 to old and restore from new
    post: ret resumes new.ra on new.sp; caller-saved registers unspecified
