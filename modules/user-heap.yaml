module: user_heap
owns: [include/kernel/heap.h, kernel/mm/heap.c]
state: Per-PCB sorted free intervals and a locked global pool of 128 region nodes
layout: Fixed page arena [0x3000, 0x1003000); heap_top is its exclusive upper bound
rules:
  - Free intervals describe virtual holes, never allocated physical memory
  - First fit for address zero; otherwise strict fixed-address allocation without replacement
  - mmap eagerly maps zeroed RWU/NX frames. Ordinary fork shares mapped frames via COW. Template branches can share leaf tables and borrow original frames.
  - No raw user pointers or dynamically allocated metadata
  - The pool lock protects freelist operations. The boot hart owns interval lists and heap edits with IRQ off, after handback if assigned to the worker.
functions:
  mmap_pool_init:
    pre: Boot hart, before secondary publication and process creation
    effects: Initialize global node freelist and spinlock
    post: All 128 nodes available
  mmap_pool_free_count:
    pre: Initialized pool
    effects: Snapshot count under pool lock
    post: Return available metadata nodes
  user_heap_init:
    pre: Empty PCB heap, owner hart with IRQ off
    effects: Reserve one node representing the entire arena
    post: Return 0 with free arena, or -12 without allocated nodes
  user_heap_alloc:
    pre: Initialized heap and process root, boot hart with IRQ off and kernel satp
    effects: Validate hint and page count, find a free interval, reserve split metadata, prepare branch table splits when needed, map pages and commit the interval change.
    post: Return page VA or -22/-12; failure restores pages, tables, nodes and list exactly
  user_heap_free:
    pre: Initialized heap and process root, boot hart with IRQ off and kernel satp
    effects: Validate the live range and reserve metadata. Split shared tables as needed, revoke mappings, release references or borrows, then insert or coalesce the free interval.
    post: Return 0 or -22/-12; failure has no externally visible mutation
  user_heap_destroy:
    pre: Owner with IRQ off and kernel satp; inactive target or current process replacing its heap in exec
    effects: Clear ordinary heap leaves or detach template branch links, retire remaining heap ownership and return all region nodes.
    post: No heap frames or metadata owned by PCB
