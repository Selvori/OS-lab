system:
  name: Seele
  scope: Lab 6 process management, based on Labs 1-5
  provenance: Self-authored from lab-4.pptx, lab-5.pdf and lab-6.pptx; no course YAML was supplied
machine:
  board: [QEMU virt RV64, VisionFive2 JH7110]
  firmware: OpenSBI S-mode entry; SBI HSM and TIME
  memory: 128 MiB platform DRAM; kernel identity mapping; separate page pools
  harts: Boot hart owns all user processes and scheduler; others service kernel interrupts
mechanisms:
  paging: Sv39, 4 KiB pages, ASID 0, sfence.vma around satp changes
  context: Integer registers only; FS/VS off in user mode
  traps: Separate kernel_vector and shared high trampoline user_vector
  interrupts: Existing per-hart SBI timer and UART/PLIC; user timer preemption; kernel handlers remain nonpreemptible
rules:
  - Complete contracts before implementation; sign off separate spec and code commits
  - Never modify xv6 or QEMU reference repositories
  - Never schedule one process on multiple harts
  - Kernel executes C only with kernel satp, gp, tp and supervisor stack
  - User page table never exposes kernel DRAM or MMIO with PTE_U
  - Null page is unmapped; code RXU; data and one stack page RWU, never RWX
  - Trampoline RX and trapframe RW are supervisor-only; kernel stack is supervisor RW
  - Ordinary interrupts preserve epc; user ecall advances epc by exactly 4
  - stvec is kernel_vector during kernel handlers; interrupts off during page-table transitions
  - Copy user buffers by validating PTE_U and PTE_R and reading their physical aliases
  - Publish shared table topology before secondary harts; only the owner accesses the mutable process-stack leaf
  - Destroy inactive user tables only; shared kernel table structure persists
  - Heap free intervals are sorted, disjoint and coalesced; mapped RWU pages are their complement
  - Heap mutation is owner-only with IRQ off, kernel satp active and no concurrent table walkers
  - Flush local TLB before reusing removed frames; prune empty private table nodes
  - Failures preserve mappings, free intervals and resource counts
non_goals: [SMP user scheduling, migration, kernel preemption, COW, exec, filesystem, demand paging, floating point, vectors]

lab6_invariants:
  - Sixteen PCB slots; init PID 0 never exits; IDs are not slot numbers
  - Only boot hart reads or writes process state, parent, channel and scheduler tick
  - Condition check, sleep publication, wakeup and switches all have IRQ off
  - No spinlocks or push_off nesting across swtch; scheduler runs on boot stack
  - Each private kernel stack has a unique shared-kernel alias and guard page
  - All kernel contexts share kernel satp; trampoline selects user root on return
  - Only RUNNABLE processes are dispatched; timer preemption uses one tick quantum
  - Exit keeps a ZOMBIE; parent wait reclaims from a different kernel stack
  - Orphans are adopted by init and init is awakened for already-zombie adoptees
  - Fork publishes RUNNABLE only after all allocations, copies and metadata succeed
  - wait status pointer is fully validated writable before reaping any child
